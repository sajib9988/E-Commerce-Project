name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: ['**']
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_ci?schema=public
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only
      - name: Commit synchronized pnpm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/backend-production-readiness'
        run: |
          if ! git -C .. diff --quiet -- backend/pnpm-lock.yaml; then
            git -C .. config user.name 'github-actions[bot]'
            git -C .. config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C .. add backend/pnpm-lock.yaml
            git -C .. commit -m 'chore(backend): sync pnpm lockfile'
            git -C .. push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload synchronized pnpm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: backend-pnpm-lockfile
          path: backend/pnpm-lock.yaml
          if-no-files-found: error
      - name: Validate Prisma schema
        run: pnpm exec prisma validate
      - name: Generate Prisma Client and build NestJS
        run: pnpm build
